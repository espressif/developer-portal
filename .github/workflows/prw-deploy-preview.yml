name: Deploy preview for PR

on:
  workflow_run:
    workflows:
      - "Build preview for PR"
    types:
      - completed

permissions:
  contents: read
  id-token: write
  pull-requests: write

# Allow only one concurrent deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  PREVIEW_BASE: https://preview-developer.espressif.com/

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download PR metadata
        uses: actions/download-artifact@v8.0.1
        with:
          name: pr-metadata
          path: ./
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate artifact metadata against workflow run
        env:
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(cat pr_num.txt)"
          PR_SHA="$(cat pr_head_sha.txt)"
          if [ -z "${WR_PR_NUMBER:-}" ]; then
            echo "workflow_run.pull_requests[0].number is empty; refusing to deploy."
            exit 1
          fi
          if [ "$PR_NUMBER" != "$WR_PR_NUMBER" ]; then
            echo "PR number mismatch: artifact=$PR_NUMBER workflow_run=$WR_PR_NUMBER"
            exit 1
          fi
          if [ "$PR_SHA" != "$WR_HEAD_SHA" ]; then
            echo "Head SHA mismatch: artifact=$PR_SHA workflow_run=$WR_HEAD_SHA"
            exit 1
          fi
          PR_URL="$(cat pr_url.txt)"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "HUGO_BASEURL=${PREVIEW_BASE}pr${PR_NUMBER}/" >> "$GITHUB_ENV"
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"
          echo "PR_LINK_TEXT=${PR_URL#https://}" >> "$GITHUB_ENV"

      - name: Download built site
        uses: actions/download-artifact@v8.0.1
        with:
          name: hugo-preview-public
          path: public/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Hugo deployment config
        env:
          PREVIEW_AWS_BUCKET_NAME: ${{ secrets.PREVIEW_AWS_BUCKET_NAME }}
        run: |
          set -euo pipefail
          mkdir -p config/_default
          printf '%s\n' \
            '[deployment]' \
            '  [[deployment.targets]]' \
            "    name = 'preview'" \
            "    url = 's3://${PREVIEW_AWS_BUCKET_NAME}?region=ap-east-1&prefix=pr${PR_NUMBER}/'" \
            '    exclude = "persist/**"' \
            > config/_default/hugo.toml
          echo "Deployment target for PR ${PR_NUMBER}:"
          grep 'url = ' config/_default/hugo.toml

      - name: Check out CI scripts from default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: tools/ci
          fetch-depth: 1
          path: upstream-ci

      - name: Install Hugo
        run: bash upstream-ci/tools/ci/install-hugo.sh

      - name: Sync persist data for PR preview
        env:
          PREVIEW_AWS_BUCKET_NAME: ${{ secrets.PREVIEW_AWS_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: bash upstream-ci/tools/ci/bootstrap_pr_preview_dir.sh

      - name: Deploy preview with Hugo
        env:
          HUGO_ENVIRONMENT: preview
          HUGO_ENV: preview
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          hugo deploy \
            --environment preview \
            --target=preview

      - name: Post Preview Link to PR
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const { data: comments } = await github.rest.issues.listComments({
                issue_number: process.env.PR_NUMBER,
                owner: context.repo.owner,
                repo: context.repo.repo
              });

              // Define the comment body
              const commentBody = `🎉 A preview for this PR is available at: ${process.env.HUGO_BASEURL}
              \n\n> [!WARNING]\n>This link is **for review only** and will expire after merge. Don't share it publicly.`;

              // Look for an existing comment containing the specific text
              const existingComment = comments.find(comment =>
                comment.body.includes("🎉 A preview for this PR is available at:")
              );

              if (existingComment) {
                await github.rest.issues.deleteComment({
                  comment_id: existingComment.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo
                });
              }

              // Create a new comment
              await github.rest.issues.createComment({
                issue_number: process.env.PR_NUMBER,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            } catch (error) {
              core.setFailed(`Failed to manage PR comment: ${error.message}`);
            }

      - name: Invalidate CloudFront cache for PR
        env:
          DISTRIBUTION_ID: ${{ secrets.PREVIEW_CLOUDFRONT_DISTRIBUTION }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Invalidating CloudFront paths for PR $PR_NUMBER..."
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/pr$PR_NUMBER/*"
